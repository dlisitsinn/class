<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Урок с Анастасией</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ecf4; --panel:#ffffff; --ink:#1d2b4f; --muted:#5b6788; --line:#d3d9e7;
  --accent:#ffd23f; --accent-ink:#1d2b4f; --brand:#2a4a9a; --brand-ink:#ffffff;
  --ok:#2f8f5b; --hover:rgba(29,43,79,.07);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131a2b; --panel:#1c2440; --ink:#e7ebf7; --muted:#9aa5c4; --line:#303a5b;
    --accent:#ffd23f; --accent-ink:#1d2b4f; --brand:#9db8ff; --brand-ink:#10193a;
    --ok:#6fd39b; --hover:rgba(231,235,247,.08);
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

header{display:flex;align-items:center;gap:14px;padding:10px 16px}
h1{font-size:1.4rem;font-weight:600;margin:0;color:var(--brand);letter-spacing:-.01em;white-space:nowrap}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);min-width:0}
.status span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.status.live .dot{background:var(--ok)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:0 12px 12px}
main.video-big{grid-template-columns:minmax(0,1fr) minmax(360px,48%)}
.board-col,.video-col{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.sep{flex:0 0 auto;width:1px;height:24px;background:var(--line);margin:0 6px}
.swatch{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;margin:0 1px}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.size span{display:block;border-radius:50%;background:currentColor}

.board-scroll{flex:1;min-height:0;overflow:auto;background:var(--bg);scrollbar-gutter:stable}
.board-inner{position:relative}
#board{display:block;touch-action:none;cursor:crosshair}
#board.hand{touch-action:pan-x pan-y;cursor:grab}
.text-editor{position:absolute;margin:0;padding:0;border:1px dashed #2a4a9a;background:rgba(255,255,255,.7);font-family:Rubik,system-ui,sans-serif;font-weight:500;line-height:1.25;resize:none;overflow:hidden;white-space:pre;outline:none;min-width:80px;z-index:2}

.pager{display:flex;align-items:center;gap:4px;padding:6px 8px;border-top:1px solid var(--line)}
.pager .label{font-size:.9rem;color:var(--muted);min-width:104px;text-align:center}
.pager .grow{flex:1}

.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;height:48px;font-size:1.05rem;justify-content:center}
.btn.primary:hover{filter:brightness(1.08);background:var(--brand)}

.video-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 14px;border-bottom:1px solid var(--line);font-weight:500}
.video-body{flex:1;position:relative;min-height:0}
#videoFrame{position:absolute;inset:0}
.join{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:24px;overflow:auto}
.join h2{font-size:1.45rem;font-weight:600;margin:0 0 18px;line-height:1.2}
.join label{display:block;font-size:.95rem;color:var(--muted);margin-bottom:6px}
.join input{width:100%;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.05rem;padding:0 14px;margin-bottom:12px}
.join .btn.primary{width:100%}
.hint{font-size:.9rem;color:var(--muted);line-height:1.45;margin:14px 0 0;max-width:34ch}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:90vw;font-size:.95rem}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

@media (max-width:860px){
  header{padding:8px 12px;gap:10px}
  h1{font-size:1.1rem}
  #copyLink .txt{display:none}
  main{grid-template-columns:1fr;grid-template-rows:38dvh minmax(0,1fr);gap:8px;padding:0 8px 8px}
  main.video-big{grid-template-columns:1fr;grid-template-rows:62dvh minmax(0,1fr)}
  .video-col{order:-1}
  .pager .label{min-width:80px}
}
</style>
</head>
<body>

<header>
  <h1>Урок с Анастасией</h1>
  <div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">Не в уроке</span></div>
  <button class="btn" id="copyLink" data-icon="link" title="Скопировать ссылку для ученика"><span class="txt">Ссылка для ученика</span></button>
</header>

<main id="main">
  <section class="board-col" aria-label="Доска">
    <div class="toolbar" role="toolbar" aria-label="Инструменты доски">
      <button class="tb" data-tool="hand" data-icon="hand" title="Рука: листать доску" aria-label="Рука"></button>
      <button class="tb" data-tool="pen" data-icon="pen" title="Ручка" aria-label="Ручка"></button>
      <button class="tb" data-tool="marker" data-icon="marker" title="Маркер" aria-label="Маркер"></button>
      <button class="tb" data-tool="eraser" data-icon="eraser" title="Ластик" aria-label="Ластик"></button>
      <button class="tb" data-tool="text" data-icon="text" title="Текст" aria-label="Текст"></button>
      <button class="tb" data-tool="line" data-icon="line" title="Линия" aria-label="Линия"></button>
      <button class="tb" data-tool="arrow" data-icon="arrow" title="Стрелка" aria-label="Стрелка"></button>
      <button class="tb" data-tool="rect" data-icon="rect" title="Прямоугольник" aria-label="Прямоугольник"></button>
      <button class="tb" data-tool="ellipse" data-icon="ellipse" title="Овал" aria-label="Овал"></button>
      <span class="sep"></span>
      <div id="swatches" style="display:flex;align-items:center;gap:2px"></div>
      <span class="sep"></span>
      <button class="tb size" data-size="0" title="Тонко" aria-label="Тонко"><span style="width:5px;height:5px"></span></button>
      <button class="tb size" data-size="1" title="Средне" aria-label="Средне"><span style="width:9px;height:9px"></span></button>
      <button class="tb size" data-size="2" title="Толсто" aria-label="Толсто"><span style="width:15px;height:15px"></span></button>
      <span class="sep"></span>
      <button class="tb" id="uploadBtn" data-icon="upload" title="Загрузить картинку или PDF" aria-label="Загрузить файл"></button>
      <button class="tb" id="undoBtn" data-icon="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить"></button>
      <button class="tb" id="clearBtn" data-icon="trash" title="Очистить лист" aria-label="Очистить лист"></button>
    </div>
    <div class="board-scroll" id="boardScroll">
      <div class="board-inner" id="boardInner"><canvas id="board"></canvas></div>
    </div>
    <div class="pager">
      <button class="tb" id="prevPage" data-icon="left" title="Предыдущий лист" aria-label="Предыдущий лист"></button>
      <span class="label" id="pageLabel">Лист 1 из 1</span>
      <button class="tb" id="nextPage" data-icon="right" title="Следующий лист" aria-label="Следующий лист"></button>
      <button class="tb" id="addPage" data-icon="plus" title="Новый лист" aria-label="Новый лист"></button>
      <button class="tb" id="delPage" data-icon="x" title="Удалить лист" aria-label="Удалить лист"></button>
      <span class="grow"></span>
      <button class="tb" id="downloadBtn" data-icon="download" title="Скачать лист картинкой" aria-label="Скачать лист"></button>
    </div>
  </section>

  <section class="video-col" aria-label="Звонок">
    <div class="video-head">
      <span>Звонок</span>
      <button class="tb" id="videoSize" data-icon="expand" title="Сделать видео крупнее" aria-label="Сделать видео крупнее"></button>
    </div>
    <div class="video-body">
      <div id="videoFrame"></div>
      <div class="join" id="join">
        <div id="joinReady">
          <h2>Готовы начать урок?</h2>
          <label for="nameInput">Как тебя зовут?</label>
          <input id="nameInput" autocomplete="given-name" maxlength="30" placeholder="Имя">
          <button class="btn primary" id="joinBtn">Войти в урок</button>
          <p class="hint">Браузер спросит разрешение на камеру и микрофон. Нажми «Разрешить».</p>
        </div>
        <div id="joinSetup" hidden>
          <h2>Звонок пока не подключён</h2>
          <p class="hint">Вставь ссылку на комнату Daily в строку ROOM_URL в начале скрипта этого файла. Доска уже работает.</p>
        </div>
      </div>
    </div>
  </section>
</main>

<input type="file" id="fileInput" accept="image/*,application/pdf" multiple hidden>
<div class="toast" id="toast" aria-live="polite"></div>

<script src="https://unpkg.com/@daily-co/daily-js"></script>
<script>
/* ================= НАСТРОЙКИ ================= */
const CONFIG = {
  // Ссылка на комнату Daily, например "https://anastasia.daily.co/lesson"
  ROOM_URL: "https://anastasiatutor.daily.co/CZUgHmIN4SAxSQb2p2Mo",
};
/* ============================================= */

const params = new URLSearchParams(location.search);
const ROOM_URL = params.get('room') || CONFIG.ROOM_URL;
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const r1 = v => Math.round(v * 10) / 10;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Иконки ---------- */
const ICONS = {
  hand:'<path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/>',
  pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  marker:'<path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>',
  eraser:'<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>',
  text:'<path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/>',
  line:'<path d="M5 19 19 5"/>',
  arrow:'<path d="M5 19 19 5"/><path d="M9 5h10v10"/>',
  rect:'<rect x="4" y="5" width="16" height="14" rx="1"/>',
  ellipse:'<ellipse cx="12" cy="12" rx="9" ry="7"/>',
  upload:'<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>',
  download:'<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  plus:'<path d="M12 5v14"/><path d="M5 12h14"/>', x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  expand:'<path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/>',
  shrink:'<path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/>',
};
const svg = name => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
document.querySelectorAll('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', svg(el.dataset.icon)));

/* ---------- Состояние доски ---------- */
const W = 1600, DEFAULT_H = 1000;
let pages = [{ id: 'p1', h: DEFAULT_H, objs: [] }];
let cur = 0;
const undoStack = [];
const imgCache = new Map();

let tool = 'pen';
const COLORS = ['#1d2b4f', '#2563eb', '#d1352b', '#1f9d55', '#f08c00', '#8b3fd9', '#ffd23f'];
const COLOR_NAMES = ['Тёмно-синий', 'Синий', 'Красный', 'Зелёный', 'Оранжевый', 'Фиолетовый', 'Жёлтый'];
let color = COLORS[0];
let sizeIdx = 1;
const PEN_W = [3, 6, 12], MARKER_W = [16, 26, 42], TEXT_S = [28, 40, 60], ERASER_R = [10, 20, 36];
const strokeWidth = () => (tool === 'marker' ? MARKER_W : PEN_W)[sizeIdx];

const wrap = $('#boardScroll'), inner = $('#boardInner'), canvas = $('#board'), ctx = canvas.getContext('2d');
let scale = 1, sizeKey = '';

const pageById = id => pages.find(p => p.id === id);

/* ---------- Отрисовка ---------- */
function sizeCanvas() {
  const p = pages[cur];
  const cw = wrap.clientWidth || 1;
  scale = cw / W;
  const dpr = window.devicePixelRatio || 1;
  const ch = Math.round(p.h * scale);
  const key = cw + 'x' + ch + '@' + dpr;
  if (key !== sizeKey) {
    sizeKey = key;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
  }
  return dpr;
}
let raf = 0, preview = null;
function requestRender() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
function render() {
  const dpr = sizeCanvas();
  const p = pages[cur];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  drawPaper(ctx, p.h);
  for (const o of p.objs) drawObj(ctx, o);
  if (preview) drawObj(ctx, preview);
}
function drawPaper(c, h) {
  c.fillStyle = '#fdfdfb'; c.fillRect(0, 0, W, h);
  c.strokeStyle = 'rgba(70,110,190,.17)'; c.lineWidth = 1;
  c.beginPath();
  for (let x = 40; x < W; x += 40) { c.moveTo(x, 0); c.lineTo(x, h); }
  for (let y = 40; y < h; y += 40) { c.moveTo(0, y); c.lineTo(W, y); }
  c.stroke();
  c.strokeStyle = 'rgba(214,70,70,.45)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(W - 120, 0); c.lineTo(W - 120, h); c.stroke();
}
function getImg(o) {
  let im = imgCache.get(o.id);
  if (!im) { im = new Image(); im.onload = requestRender; im.src = o.src; imgCache.set(o.id, im); }
  return im;
}
function drawObj(c, o) {
  c.save();
  if (o.type === 'image') {
    const im = getImg(o);
    if (im.complete && im.naturalWidth) c.drawImage(im, o.x, o.y, o.w, o.h);
    else { c.fillStyle = 'rgba(42,74,154,.08)'; c.fillRect(o.x, o.y, o.w, o.h); }
    c.restore(); return;
  }
  c.strokeStyle = c.fillStyle = o.color;
  c.lineWidth = o.w || 1; c.lineCap = 'round'; c.lineJoin = 'round';
  if (o.type === 'stroke') {
    if (o.hl) { c.globalAlpha = .35; c.lineCap = 'butt'; }
    const p = o.pts;
    if (p.length <= 2) { c.beginPath(); c.arc(p[0], p[1], o.w / 2, 0, Math.PI * 2); c.fill(); }
    else {
      c.beginPath(); c.moveTo(p[0], p[1]);
      for (let i = 2; i < p.length - 2; i += 2) {
        c.quadraticCurveTo(p[i], p[i + 1], (p[i] + p[i + 2]) / 2, (p[i + 1] + p[i + 3]) / 2);
      }
      c.lineTo(p[p.length - 2], p[p.length - 1]); c.stroke();
    }
  } else if (o.type === 'line' || o.type === 'arrow') {
    c.beginPath(); c.moveTo(o.x1, o.y1); c.lineTo(o.x2, o.y2); c.stroke();
    if (o.type === 'arrow') {
      const a = Math.atan2(o.y2 - o.y1, o.x2 - o.x1), L = Math.max(16, o.w * 4);
      c.beginPath();
      c.moveTo(o.x2, o.y2); c.lineTo(o.x2 - L * Math.cos(a - .45), o.y2 - L * Math.sin(a - .45));
      c.moveTo(o.x2, o.y2); c.lineTo(o.x2 - L * Math.cos(a + .45), o.y2 - L * Math.sin(a + .45));
      c.stroke();
    }
  } else if (o.type === 'rect') {
    c.strokeRect(Math.min(o.x1, o.x2), Math.min(o.y1, o.y2), Math.abs(o.x2 - o.x1), Math.abs(o.y2 - o.y1));
  } else if (o.type === 'ellipse') {
    c.beginPath();
    c.ellipse((o.x1 + o.x2) / 2, (o.y1 + o.y2) / 2, Math.abs(o.x2 - o.x1) / 2, Math.abs(o.y2 - o.y1) / 2, 0, 0, Math.PI * 2);
    c.stroke();
  } else if (o.type === 'text') {
    c.font = `500 ${o.size}px Rubik, system-ui, sans-serif`;
    c.textBaseline = 'top';
    o.text.split('\n').forEach((ln, i) => c.fillText(ln, o.x, o.y + o.size * .125 + i * o.size * 1.25));
  }
  c.restore();
}

/* ---------- Ластик: попадание ---------- */
function distSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
  let t = L ? ((px - x1) * dx + (py - y1) * dy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
function hit(o, x, y, r) {
  const R = r + (o.w || 0) / 2;
  switch (o.type) {
    case 'stroke': {
      const p = o.pts;
      if (p.length <= 2) return Math.hypot(x - p[0], y - p[1]) <= R;
      for (let i = 0; i < p.length - 2; i += 2) if (distSeg(x, y, p[i], p[i + 1], p[i + 2], p[i + 3]) <= R) return true;
      return false;
    }
    case 'line': case 'arrow': return distSeg(x, y, o.x1, o.y1, o.x2, o.y2) <= R;
    case 'rect': {
      const a = [o.x1, o.y1, o.x2, o.y1, o.x2, o.y2, o.x1, o.y2, o.x1, o.y1];
      for (let i = 0; i < 8; i += 2) if (distSeg(x, y, a[i], a[i + 1], a[i + 2], a[i + 3]) <= R) return true;
      return false;
    }
    case 'ellipse': {
      const cx = (o.x1 + o.x2) / 2, cy = (o.y1 + o.y2) / 2, rx = Math.abs(o.x2 - o.x1) / 2, ry = Math.abs(o.y2 - o.y1) / 2;
      let px = cx + rx, py = cy;
      for (let k = 1; k <= 32; k++) {
        const a = k / 32 * Math.PI * 2, nx = cx + rx * Math.cos(a), ny = cy + ry * Math.sin(a);
        if (distSeg(x, y, px, py, nx, ny) <= R) return true;
        px = nx; py = ny;
      }
      return false;
    }
    case 'text': {
      const lines = o.text.split('\n');
      const w = Math.max(...lines.map(l => l.length)) * o.size * .58, h = lines.length * o.size * 1.25;
      return x >= o.x - r && x <= o.x + w + r && y >= o.y - r && y <= o.y + h + r;
    }
  }
  return false;
}

/* ---------- Рисование ---------- */
let drawing = null;
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale];
}
canvas.addEventListener('pointerdown', e => {
  commitText();
  if (tool === 'hand') return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const [x, y] = toLogical(e);
  const pg = pages[cur].id;
  if (tool === 'text') { setTimeout(() => openTextEditor(x, y)); return; }
  canvas.setPointerCapture(e.pointerId);
  if (tool === 'eraser') { drawing = { eraser: true, pg, removed: [] }; eraseAt(x, y); return; }
  if (tool === 'pen' || tool === 'marker') {
    const o = { id: uid(), type: 'stroke', color, w: strokeWidth(), hl: tool === 'marker', pts: [r1(x), r1(y)] };
    pages[cur].objs.push(o);
    drawing = { obj: o, pg, sent: 2, last: performance.now() };
    send({ t: 'begin', pg, o });
    requestRender(); return;
  }
  preview = { id: uid(), type: tool, color, w: PEN_W[sizeIdx], x1: r1(x), y1: r1(y), x2: r1(x), y2: r1(y) };
  drawing = { shape: true, pg };
  requestRender();
});
canvas.addEventListener('pointermove', e => {
  if (!drawing) return;
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  if (!evs.length) evs = [e];
  if (drawing.eraser) { for (const ev of evs) { const [x, y] = toLogical(ev); eraseAt(x, y); } return; }
  if (drawing.obj) {
    const p = drawing.obj.pts;
    for (const ev of evs) {
      const [x, y] = toLogical(ev);
      if (Math.hypot(x - p[p.length - 2], y - p[p.length - 1]) < 1.5) continue;
      p.push(r1(x), r1(y));
    }
    if (performance.now() - drawing.last > 40) flushPts(drawing);
    requestRender(); return;
  }
  if (preview) { const [x, y] = toLogical(e); preview.x2 = r1(x); preview.y2 = r1(y); requestRender(); }
});
function flushPts(d) {
  const p = d.obj.pts;
  if (p.length > d.sent) { send({ t: 'pts', pg: d.pg, id: d.obj.id, p: p.slice(d.sent) }); d.sent = p.length; }
  d.last = performance.now();
}
function endDraw() {
  if (!drawing) return;
  const d = drawing; drawing = null;
  if (d.eraser) { if (d.removed.length) undoStack.push({ pg: d.pg, del: d.removed }); return; }
  if (d.obj) { flushPts(d); undoStack.push({ pg: d.pg, add: [d.obj.id] }); return; }
  if (preview) {
    const o = preview; preview = null;
    if (Math.abs(o.x2 - o.x1) < 3 && Math.abs(o.y2 - o.y1) < 3) { requestRender(); return; }
    const p = pageById(d.pg); if (!p) return;
    p.objs.push(o);
    undoStack.push({ pg: d.pg, add: [o.id] });
    send({ t: 'add', pg: d.pg, objs: [o] });
    requestRender();
  }
}
canvas.addEventListener('pointerup', endDraw);
canvas.addEventListener('pointercancel', endDraw);

function eraseAt(x, y) {
  const p = pages[cur], r = ERASER_R[sizeIdx], removed = [];
  p.objs = p.objs.filter(o => {
    if (o.type !== 'image' && hit(o, x, y, r)) { removed.push(o); return false; }
    return true;
  });
  if (removed.length) {
    drawing.removed.push(...removed);
    send({ t: 'del', pg: p.id, ids: removed.map(o => o.id) });
    requestRender();
  }
}

/* ---------- Текст ---------- */
let editor = null;
function openTextEditor(x, y) {
  commitText();
  const size = TEXT_S[sizeIdx];
  const ta = document.createElement('textarea');
  ta.className = 'text-editor';
  ta.rows = 1; ta.spellcheck = false;
  ta.setAttribute('aria-label', 'Текст на доске');
  Object.assign(ta.style, { left: x * scale + 'px', top: y * scale + 'px', fontSize: size * scale + 'px', color });
  inner.appendChild(ta);
  editor = { ta, x: r1(x), y: r1(y), size, color, pg: pages[cur].id };
  const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; ta.style.width = 'auto'; ta.style.width = Math.max(80, ta.scrollWidth + 4) + 'px'; };
  ta.addEventListener('input', grow);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(); }
    else if (e.key === 'Escape') { const t = editor; editor = null; t.ta.remove(); }
  });
  ta.addEventListener('blur', commitText);
  grow(); ta.focus();
}
function commitText() {
  if (!editor) return;
  const e = editor; editor = null;
  const t = e.ta.value.replace(/\s+$/, '');
  e.ta.remove();
  if (!t) return;
  const p = pageById(e.pg); if (!p) return;
  const o = { id: uid(), type: 'text', color: e.color, size: e.size, x: e.x, y: e.y, text: t };
  p.objs.push(o);
  undoStack.push({ pg: e.pg, add: [o.id] });
  send({ t: 'add', pg: e.pg, objs: [o] });
  requestRender();
}

/* ---------- Отмена, очистка ---------- */
function undo() {
  commitText();
  const u = undoStack.pop(); if (!u) return;
  const p = pageById(u.pg); if (!p) return undo();
  if (u.add) {
    const s = new Set(u.add);
    p.objs = p.objs.filter(o => !s.has(o.id));
    send({ t: 'del', pg: u.pg, ids: u.add });
  } else if (u.del) {
    for (const o of u.del) if (!p.objs.some(x => x.id === o.id)) p.objs.push(o);
    send({ t: 'add', pg: u.pg, objs: u.del });
  }
  const i = pages.indexOf(p);
  if (i !== cur) goTo(i); else requestRender();
}
function clearPage() {
  const p = pages[cur];
  if (!p.objs.length) return;
  if (!confirm('Очистить этот лист у всех участников?')) return;
  undoStack.push({ pg: p.id, del: p.objs.slice() });
  p.objs = [];
  send({ t: 'clear', pg: p.id });
  requestRender();
}

/* ---------- Листы ---------- */
function updatePager() {
  $('#pageLabel').textContent = `Лист ${cur + 1} из ${pages.length}`;
  $('#prevPage').disabled = cur === 0;
  $('#nextPage').disabled = cur === pages.length - 1;
  $('#delPage').disabled = pages.length === 1;
}
function goTo(i, broadcast = true) {
  if (i < 0 || i >= pages.length) return;
  commitText();
  cur = i; wrap.scrollTop = 0;
  render(); updatePager();
  if (broadcast) send({ t: 'page', id: pages[cur].id });
}
function insertPage(page, afterId) {
  if (pageById(page.id)) return;
  const a = afterId ? pages.findIndex(p => p.id === afterId) : -1;
  const idx = a >= 0 ? a + 1 : pages.length;
  if (idx <= cur) cur++;
  pages.splice(idx, 0, page);
  updatePager();
}
function removePage(id) {
  const i = pages.findIndex(p => p.id === id);
  if (i < 0 || pages.length === 1) return;
  pages.splice(i, 1);
  if (i < cur) cur--;
  else if (cur >= pages.length) cur = pages.length - 1;
  render(); updatePager();
}
function addBlankPage() {
  const after = pages[cur].id;
  const page = { id: uid(), h: DEFAULT_H, objs: [] };
  insertPage(page, after);
  send({ t: 'addPage', page, after });
  goTo(pages.indexOf(page));
}
function deleteCurrentPage() {
  if (pages.length === 1) return;
  if (!confirm('Удалить этот лист у всех участников?')) return;
  const id = pages[cur].id;
  removePage(id);
  send({ t: 'delPage', id });
}
function downloadPage() {
  const p = pages[cur];
  const c = document.createElement('canvas'); c.width = W; c.height = p.h;
  const x = c.getContext('2d');
  drawPaper(x, p.h); p.objs.forEach(o => drawObj(x, o));
  c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = `урок-лист-${cur + 1}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }, 'image/png');
}

/* ---------- Файлы ---------- */
function loadImg(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
function compress(source, w, h) {
  const k = Math.min(1, 1400 / w);
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(source, 0, 0, c.width, c.height);
  return { src: c.toDataURL('image/jpeg', .72), w: c.width, h: c.height };
}
async function addImageFile(f) {
  const url = URL.createObjectURL(f);
  let im;
  try { im = await loadImg(url); } catch { toast('Не получилось открыть картинку.'); return; }
  finally { URL.revokeObjectURL(url); }
  const img = compress(im, im.naturalWidth, im.naturalHeight);
  const p = pages[cur];
  const dw = Math.min(W - 200, img.w), dh = Math.round(img.h * dw / img.w);
  const y = p.objs.length ? Math.round(wrap.scrollTop / scale + 40) : 40;
  const o = { id: uid(), type: 'image', x: 40, y, w: dw, h: dh, src: img.src };
  const newH = Math.max(p.h, y + dh + 40);
  p.h = newH; p.objs.push(o);
  undoStack.push({ pg: p.id, add: [o.id] });
  send({ t: 'add', pg: p.id, objs: [o], h: newH });
  render();
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function getPdfjs() {
  if (!window.pdfjsLib) {
    await loadScript(PDFJS + 'pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  }
  return window.pdfjsLib;
}
async function addPdfFile(f) {
  let lib;
  try { lib = await getPdfjs(); } catch { toast('Не загрузился модуль PDF. Проверь интернет.'); return; }
  let doc;
  try { doc = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise; }
  catch { toast('Не получилось открыть этот PDF.'); return; }
  const n = Math.min(doc.numPages, 30);
  let after = pages[cur].id, firstId = null;
  for (let i = 1; i <= n; i++) {
    toast(`Открываю PDF: страница ${i} из ${n}`, true);
    const pg = await doc.getPage(i);
    const v1 = pg.getViewport({ scale: 1 });
    const vp = pg.getViewport({ scale: 1400 / v1.width });
    const c = document.createElement('canvas');
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const cx = c.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
    await pg.render({ canvasContext: cx, viewport: vp }).promise;
    const img = compress(c, c.width, c.height);
    const dw = W - 200, dh = Math.round(img.h * dw / img.w);
    const page = { id: uid(), h: Math.max(DEFAULT_H, dh + 80), objs: [{ id: uid(), type: 'image', x: 40, y: 40, w: dw, h: dh, src: img.src }] };
    insertPage(page, after);
    send({ t: 'addPage', page, after });
    after = page.id;
    if (!firstId) firstId = page.id;
  }
  toast(doc.numPages > 30 ? 'Добавлены первые 30 страниц PDF.' : 'PDF добавлен на доску.');
  goTo(pages.findIndex(p => p.id === firstId));
}
$('#fileInput').addEventListener('change', async e => {
  for (const f of e.target.files) {
    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) await addPdfFile(f);
    else if (f.type.startsWith('image/')) await addImageFile(f);
    else toast('Этот формат не открыть. Сохрани файл как PDF или картинку.');
  }
  e.target.value = '';
});

/* ---------- Связь через звонок ---------- */
let call = null, inCall = false, participants = 0;
const outQ = []; let pumping = false;
const CHUNK = 2800;
function send(msg) {
  if (!inCall || !call) return;
  const s = JSON.stringify(msg);
  if (s.length <= CHUNK) outQ.push({ _cls: 1, s });
  else {
    const id = uid(), n = Math.ceil(s.length / CHUNK);
    for (let i = 0; i < n; i++) outQ.push({ _cls: 2, id, i, n, s: s.slice(i * CHUNK, (i + 1) * CHUNK) });
  }
  pump();
}
async function pump() {
  if (pumping) return;
  pumping = true;
  let chunks = 0;
  while (outQ.length && call) {
    const m = outQ.shift();
    try { call.sendAppMessage(m, '*'); } catch (err) { console.warn(err); }
    if (m._cls === 2) {
      chunks++;
      if (chunks % 10 === 0) {
        const left = outQ.filter(q => q._cls === 2).length;
        setStatus(left ? `Отправляю файл, осталось ${Math.ceil(left / 10)}…` : null);
      }
      await sleep(25);
    }
  }
  pumping = false;
  setStatus();
}
const inBuf = new Map();
function onAppMessage(ev) {
  const d = ev && ev.data;
  if (!d || !d._cls) return;
  if (d._cls === 1) { handle(JSON.parse(d.s)); return; }
  let b = inBuf.get(d.id);
  if (!b) { b = { parts: new Array(d.n), got: 0, n: d.n }; inBuf.set(d.id, b); }
  if (b.parts[d.i] === undefined) { b.parts[d.i] = d.s; b.got++; }
  if (b.got % 10 === 0) setStatus(`Получаю файл: ${Math.round(b.got / b.n * 100)}%`);
  if (b.got === b.n) { inBuf.delete(d.id); handle(JSON.parse(b.parts.join(''))); setStatus(); }
}
function handle(m) {
  switch (m.t) {
    case 'begin': { const p = pageById(m.pg); if (p && !p.objs.some(o => o.id === m.o.id)) p.objs.push(m.o); break; }
    case 'pts': { const p = pageById(m.pg); const o = p && p.objs.find(x => x.id === m.id); if (o) o.pts.push(...m.p); break; }
    case 'add': {
      const p = pageById(m.pg); if (!p) break;
      if (m.h) p.h = Math.max(p.h, m.h);
      for (const o of m.objs) if (!p.objs.some(x => x.id === o.id)) p.objs.push(o);
      break;
    }
    case 'del': { const p = pageById(m.pg); if (p) { const s = new Set(m.ids); p.objs = p.objs.filter(o => !s.has(o.id)); } break; }
    case 'clear': { const p = pageById(m.pg); if (p) p.objs = []; break; }
    case 'addPage': insertPage(m.page, m.after); break;
    case 'delPage': removePage(m.id); break;
    case 'page': { const i = pages.findIndex(p => p.id === m.id); if (i >= 0) goTo(i, false); return; }
    case 'state': {
      let prev = null;
      for (const ip of m.pages) {
        const ex = pageById(ip.id);
        if (ex) {
          ex.h = Math.max(ex.h, ip.h);
          for (const o of ip.objs) if (!ex.objs.some(x => x.id === o.id)) ex.objs.push(o);
        } else insertPage(ip, prev);
        prev = ip.id;
      }
      updatePager();
      break;
    }
  }
  requestRender();
}
let stateTimer = 0;
function sendState() { clearTimeout(stateTimer); stateTimer = setTimeout(() => send({ t: 'state', pages }), 600); }

function countParticipants() { participants = call ? Object.keys(call.participants()).length : 0; }
function setStatus(override) {
  const el = $('#status'), txt = $('#statusText');
  el.classList.toggle('live', inCall);
  if (override) { txt.textContent = override; return; }
  if (!ROOM_URL) txt.textContent = 'Звонок не настроен';
  else if (!inCall) txt.textContent = 'Не в уроке';
  else if (participants <= 1) txt.textContent = 'В уроке, ждём второго участника';
  else txt.textContent = `В уроке, участников: ${participants}`;
}
function showJoin(show) { $('#join').hidden = !show; }

async function joinLesson() {
  if (!window.DailyIframe) { toast('Не загрузился модуль звонка. Проверь интернет и обнови страницу.'); return; }
  const userName = $('#nameInput').value.trim() || 'Участник';
  showJoin(false);
  const opts = { iframeStyle: { width: '100%', height: '100%', border: '0' }, showLeaveButton: true, showFullscreenButton: true };
  try { call = DailyIframe.createFrame($('#videoFrame'), { ...opts, lang: 'ru' }); }
  catch { call = DailyIframe.createFrame($('#videoFrame'), opts); }
  call
    .on('joined-meeting', () => { inCall = true; countParticipants(); setStatus(); if (participants > 1) sendState(); })
    .on('participant-joined', () => { countParticipants(); setStatus(); sendState(); })
    .on('participant-left', () => { countParticipants(); setStatus(); })
    .on('app-message', onAppMessage)
    .on('left-meeting', leave)
    .on('error', ev => { console.warn(ev); if (!inCall) return; toast('Звонок прервался: ' + errText(ev)); leave(); });
  try { await call.join({ url: ROOM_URL, userName }); }
  catch (err) { console.warn(err); toast('Не получилось войти: ' + errText(err), true); setTimeout(() => $('#toast').classList.remove('show'), 12000); leave(); }
}
function errText(e) {
  if (!e) return 'неизвестная ошибка';
  const parts = [e.errorMsg, e.error && (e.error.type || e.error.msg), e.message].filter(Boolean);
  return parts.length ? [...new Set(parts)].join(' / ') : String(e);
}
function leave() {
  inCall = false; outQ.length = 0;
  const c = call; call = null;
  if (c) setTimeout(() => { try { c.destroy(); } catch {} }, 0);
  countParticipants(); setStatus(); showJoin(true);
}

/* ---------- Интерфейс ---------- */
let toastTimer = 0;
function toast(msg, sticky) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function setTool(t) {
  commitText(); tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t));
  canvas.classList.toggle('hand', t === 'hand');
}
function setColor(c) {
  color = c;
  document.querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-pressed', b.dataset.color === c));
  document.querySelectorAll('.size').forEach(b => b.style.color = c === '#ffd23f' ? '#c9a100' : c);
}
function setSize(i) {
  sizeIdx = i;
  document.querySelectorAll('.size').forEach(b => b.setAttribute('aria-pressed', +b.dataset.size === i));
}
const sw = $('#swatches');
COLORS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'swatch'; b.dataset.color = c; b.style.background = c;
  b.title = COLOR_NAMES[i]; b.setAttribute('aria-label', COLOR_NAMES[i]);
  b.onclick = () => setColor(c);
  sw.appendChild(b);
});
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.querySelectorAll('.size').forEach(b => b.onclick = () => setSize(+b.dataset.size));
$('#uploadBtn').onclick = () => $('#fileInput').click();
$('#undoBtn').onclick = undo;
$('#clearBtn').onclick = clearPage;
$('#prevPage').onclick = () => goTo(cur - 1);
$('#nextPage').onclick = () => goTo(cur + 1);
$('#addPage').onclick = addBlankPage;
$('#delPage').onclick = deleteCurrentPage;
$('#downloadBtn').onclick = downloadPage;
$('#joinBtn').onclick = joinLesson;
$('#nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinLesson(); });
$('#videoSize').onclick = () => {
  const big = $('#main').classList.toggle('video-big');
  const b = $('#videoSize');
  b.innerHTML = svg(big ? 'shrink' : 'expand');
  const label = big ? 'Сделать видео меньше' : 'Сделать видео крупнее';
  b.title = label; b.setAttribute('aria-label', label);
};
$('#copyLink').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); toast('Ссылка скопирована. Отправь её ученику.'); }
  catch { prompt('Скопируй ссылку для ученика:', location.href); }
};
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
});
new ResizeObserver(() => { commitText(); render(); }).observe(wrap);

/* ---------- Старт ---------- */
setTool('pen'); setColor(COLORS[0]); setSize(1);
if (!ROOM_URL) { $('#joinReady').hidden = true; $('#joinSetup').hidden = false; }
setStatus(); updatePager(); render();
</script>
</body>
